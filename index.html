<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Zivo — Gradient Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23F73A52'/></svg>" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/ui.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="titlebar__brand">
          <span class="dot"></span>
          <span class="wordmark">Gradient Studio</span>
        </div>
        <nav class="segmented" id="tabs" role="tablist"></nav>
        <div class="titlebar__right" id="titlebar-right"></div>
      </header>

      <main class="workspace">
        <aside class="sidebar sidebar--left" id="sidebar-left"></aside>
        <section class="stage" id="stage">
          <div class="stage__frame" id="stage-frame"></div>
          <div class="stage__hud" id="stage-hud"></div>
        </section>
        <aside class="sidebar sidebar--right" id="sidebar-right"></aside>
      </main>
    </div>
    <div class="toast" id="toast" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
